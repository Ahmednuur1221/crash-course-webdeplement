<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Feedback Form</title>
</head>

<body>

    <main>

        <h1>Website Feedback Form</h1>

        <p>
            Please complete the form below to tell us about your experience.
        </p>

        <form action="#" method="post">

            <!-- Name -->
            <label for="name">Name:</label>
            
            <input
                type="text"
                id="name"
                name="name"
                required
                placeholder="Please enter your full name."
            >
     
            <small id="name-help">
              
            </small>

            <br><br>

            <!-- Email -->
            <label for="email">Email:</label>
       
            <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="inter your email"
            >
            <br>
            <small id="email-help">
              
            </small>

            <br><br>

            <!-- Satisfaction Rating -->
            <fieldset>

                <legend>
                    How satisfied are you with our website?
                </legend>
            <input type="radio" name="satisfaction" value="Excellent"> Excellent
            <input type="radio" name="satisfaction" value="Very Good"> Very Good
            <input type="radio" name="satisfaction" value="Good"> Good
            <input type="radio" name="satisfaction" value="Fair"> Fair
            <input type="radio" name="satisfaction" value="Needs Improvement"> Needs Improvement        

            </fieldset>

            <br>

            <!-- Comments -->
            <label for="comments">Comments</label>
            <br>
            <textarea
                id="comments"
                name="comments"
                rows="6"
                required
                minlength="10"
                maxlength="50"
               placeholder=" Please enter at least 10 characters."
            ></textarea>
           
            <br>
            <!-- Submit -->
            <button type="submit">
                Submit Feedback
            </button>

        </form>

    </main>

</body>
</html>
