<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Bite</title>
</head>
<body>

    <header id="home">
        <h1>Ocean Bite</h1>
    </header>

    <main>

        <section id="about" class="restaurant-section">
            <h2>About Us</h2>

            <img
                src="https://th.bing.com/th/id/OIP.4KdOxEpwPTyfnGPNUxQtZwHaEc?w=274&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3"
                alt="Fresh seafood meal served at Ocean Bite"
                width="300"
            >

            <p>
                Ocean Bite is a local restaurant offering fresh seafood,
                delicious meals, and friendly service for families and guests.
            </p>
        </section>

        <section id="contact" class="contact-section">
            <h2>Contact Us</h2>

            <form>
                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <br><br>

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <br><br>

                <label for="message">Message:</label>
                <br>

                <textarea
                    id="message"
                    name="message"
                    rows="4"
                    required
                ></textarea>

                <br><br>

                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <footer>
        <p>Email: ahmedabdiy294@gmail.com</p>
        <p>Phone: +252 61 0000000</p>
        <p>&copy; 2026 Ocean Bite</p>
    </footer>

</body>
</html>
