<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Page</title>
</head>

<body>

    <h1>Multimedia Page</h1>

    <!-- Image -->
    <h2>Travel Image</h2>

    <img
        src="/lessons/WhatsApp Image 2026-08-16 at 11.34.55 PM.jpeg"
        alt="Beautiful sea and travel destination"
        width="50"
    >

    <br><br>


    <!-- Video -->
    <h2>Travel Video</h2>

    <video
        src="/lessons/Sequence 09_5 (1).mp4"
        width="100"
        controls
        autoplay
        muted
        loop
    >
        Your browser does not support the video element.
    </video>

    <br><br>


    <!-- Audio -->
    <h2>Travel Sound</h2>

    <audio controls>
        <source
            src="/lessons/WhatsApp Audio 2026-08-17 at 1.55.18 PM.aac"
            type="audio/aac"
        >
        Your browser does not support the audio element.
    </audio>

</body>

</html>
