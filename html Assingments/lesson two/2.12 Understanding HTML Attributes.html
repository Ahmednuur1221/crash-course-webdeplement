```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
</head>

<body>

    <header>
        <h1>Tech Store</h1>
        <p>Welcome to our product page.</p>
    </header>

    <main>

        <section>
            <h2>Premium Laptop</h2>

            <!-- Image: src, alt, and title -->
            <img
                src="https://tse1.mm.bing.net/th/id/OIP.g7kFL2BLikR-3icFuavgbQHaFj?r=0&pid=ImgDet&w=201&h=150&c=7&dpr=1.3&o=7&rm=3"
                alt="Premium black laptop"
                title="Premium Laptop"
                width="400"
                height="250"
            >

            <p>
                A high-quality laptop suitable for students,
                programmers, and everyday work.
            </p>

            <p><strong>Price: $650</strong></p>

            <!-- Link: href, id, and class -->
            <a
                href="https://example.com"
                id="product-link"
                class="product-button"
            >
                View Product
            </a>
        </section>

        <section>
            <h2>Order Form</h2>

            <form>

                <!-- Input: placeholder and required -->
                <label for="name">Full Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <br><br>

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <br><br>

                <!-- Boolean attribute: disabled -->
                <button type="submit">Place Order</button>

                <button type="button" disabled>
                    Out of Stock
                </button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Tech Store</p>
    </footer>

</body>

</html>
```
